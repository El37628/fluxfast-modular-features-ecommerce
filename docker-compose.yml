services:
  mysql:
    image: mysql:8.4
    container_name: ecommerce_modular_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ecommerce_modular
      MYSQL_USER: fluxuser
      MYSQL_PASSWORD: fluxpassword
    ports:
      - "33063:3306"
    volumes:
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
      - mysql_modular_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_modular_api
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+asyncmy://fluxuser:fluxpassword@mysql:3306/ecommerce_modular
      APP_ENV: production
      PORT: 8000
    ports:
      - "8002:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_modular_data:
